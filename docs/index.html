<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直升机空气动力学 · 学习笔记</title>
<meta name="description" content="《直升机空气动力学》（招启军、徐国华、王博 著）逐章学习笔记：核心概念、关键结论、公式推导与思维导图。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<script>
(function () {
  try {
    if (localStorage.getItem('hpad-theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  } catch (e) {}
})();
</script>
<div id="app">加载中……</div>

<script>
window.$docsify = {
  name: '直升机空气动力学',
  repo: 'https://github.com/Ranbot1/Helicopter-aerodynamics',
  loadSidebar: true,
  subMaxLevel: 2,
  maxLevel: 4,
  auto2top: true,
  relativePath: false,
  notFoundPage: {
    '/': '页面不存在，请从左侧目录重新进入。'
  },
  pagination: {
    previousText: '上一节',
    nextText: '下一节',
    crossChapter: true,
    crossChapterText: true
  },
  themeColor: '#0369a1',
  plugins: [
    function (hook, vm) {
      hook.beforeEach(function (content) {
        return content.replace(/```mermaid\r?\n([\s\S]*?)```/g, function (m, code) {
          return '<div class="mermaid-wrap"><div class="mermaid">' +
            code.trim().split(/\n\s*\n/).join('\n') + '</div></div>';
        });
      });

      hook.doneEach(function () {
        if (window.mermaid) {
          var nodes = [];
          document.querySelectorAll('.mermaid').forEach(function (el) {
            if (!el.querySelector('svg')) {
              el.removeAttribute('data-processed');
              nodes.push(el);
            }
          });
          if (nodes.length) {
            try {
              window.mermaid.run({ nodes: nodes });
            } catch (e) {
              console.warn('mermaid render failed', e);
            }
          }
        }
        injectThemeToggle();
      });
    }
  ]
};

function injectThemeToggle() {
  var sidebar = document.querySelector('.sidebar-nav');
  if (!sidebar || document.querySelector('.theme-toggle-btn')) return;
  var btn = document.createElement('div');
  btn.className = 'theme-toggle-btn';
  btn.textContent = document.body.classList.contains('dark-mode') ? '浅色模式' : '深色模式';
  btn.onclick = function () {
    document.body.classList.toggle('dark-mode');
    var isDark = document.body.classList.contains('dark-mode');
    try { localStorage.setItem('hpad-theme', isDark ? 'dark' : 'light'); } catch (e) {}
    btn.textContent = isDark ? '浅色模式' : '深色模式';
    document.querySelectorAll('.mermaid svg').forEach(function (svg) {
      svg.style.opacity = '1';
    });
  };
  sidebar.insertBefore(btn, sidebar.firstChild);
}

window.addEventListener('load', function () {
  if (window.mermaid) {
    window.mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
      themeVariables: { fontFamily: 'inherit', fontSize: '14px' }
    });
  }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-katex@1.4.4/dist/docsify-katex.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
</body>
</html>
